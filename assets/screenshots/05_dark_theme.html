<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { width: 1080px; height: 1920px; overflow: hidden; font-family: 'Segoe UI', Roboto, Arial, sans-serif; background: #121212; }
  
  .phone-frame {
    width: 1080px; height: 1920px; display: flex; flex-direction: column;
    background: #121212; position: relative;
  }
  
  .status-bar { height: 44px; background: #121212; display: flex; align-items: center; justify-content: space-between; padding: 0 16px; color: #FFFFFF; font-size: 14px; }
  .app-bar { height: 64px; background: #121212; display: flex; align-items: center; padding: 0 16px; color: white; }
  .app-bar .menu-icon { font-size: 28px; margin-right: 16px; }
  .app-bar .title { font-size: 22px; font-weight: 500; }
  
  .content { flex: 1; padding: 40px 32px; display: flex; flex-direction: column; align-items: center; gap: 32px; }
  
  .profile-card {
    background: #1E1E1E; border-radius: 16px; padding: 32px;
    display: flex; flex-direction: column; align-items: center; width: 100%;
  }
  .avatar { width: 120px; height: 120px; border-radius: 50%; background: #1976D2; display: flex; align-items: center; justify-content: center; color: white; font-size: 48px; font-weight: 600; margin-bottom: 16px; }
  .name { font-size: 26px; font-weight: 600; color: #FFFFFF; }
  .role { font-size: 18px; color: #B0B0B0; margin-top: 6px; }
  
  .dark-card {
    background: #1E1E1E; border-radius: 16px; padding: 24px; width: 100%;
  }
  .card-title { font-size: 18px; font-weight: 600; color: #FFFFFF; margin-bottom: 16px; }
  .info-row { display: flex; align-items: center; gap: 12px; padding: 12px 0; border-bottom: 1px solid #2C2C2C; }
  .info-row:last-child { border: none; }
  .info-row .icon { width: 40px; height: 40px; border-radius: 10px; background: #2C2C2C; display: flex; align-items: center; justify-content: center; font-size: 20px; }
  .info-row .label { font-size: 14px; color: #B0B0B0; }
  .info-row .value { font-size: 16px; color: #FFFFFF; }
  
  .theme-toggle {
    display: flex; align-items: center; justify-content: space-between;
    background: #1E1E1E; border-radius: 16px; padding: 20px 24px; width: 100%;
  }
  .toggle-label { font-size: 18px; color: #FFFFFF; }
  .toggle-switch {
    width: 60px; height: 32px; background: #1976D2; border-radius: 16px;
    position: relative; display: flex; align-items: center;
  }
  .toggle-switch::after {
    content: ''; position: absolute; right: 4px; width: 24px; height: 24px;
    background: white; border-radius: 50%;
  }
  
  .bottom-nav {
    height: 80px; background: #1E1E1E; border-top: 1px solid #2C2C2C;
    display: flex; align-items: center; justify-content: space-around;
  }
  .nav-item { display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 12px; color: #B0B0B0; }
  .nav-item.active { color: #1976D2; }
  .nav-item .nav-icon { font-size: 24px; }
  
  .caption-overlay {
    position: absolute; bottom: 100px; left: 50%; transform: translateX(-50%);
    background: rgba(25,25,25,0.9); color: white; padding: 12px 32px; border-radius: 24px;
    font-size: 20px; font-weight: 500; white-space: nowrap; border: 1px solid #333;
  }
</style>
</head>
<body>
<div class="phone-frame">
  <div class="status-bar"><span>9:41</span><span>100%</span></div>
  <div class="app-bar">
    <span class="menu-icon">&#9776;</span>
    <span class="title">VCardSmart</span>
  </div>
  
  <div class="content">
    <div class="profile-card">
      <div class="avatar">MC</div>
      <div class="name">Maria Clara</div>
      <div class="role">Desenvolvedora Full Stack</div>
    </div>
    
    <div class="dark-card">
      <div class="card-title">Dados Profissionais</div>
      <div class="info-row">
        <div class="icon">&#128231;</div>
        <div><div class="label">Email</div><div class="value">maria@techsolutions.com.br</div></div>
      </div>
      <div class="info-row">
        <div class="icon">&#128222;</div>
        <div><div class="label">Telefone</div><div class="value">+55 11 99999-0000</div></div>
      </div>
      <div class="info-row">
        <div class="icon">&#128205;</div>
        <div><div class="label">Localizacao</div><div class="value">Sao Paulo, SP</div></div>
      </div>
    </div>
    
    <div class="theme-toggle">
      <div class="toggle-label">&#127769; Modo Escuro</div>
      <div class="toggle-switch"></div>
    </div>
  </div>
  
  <div class="caption-overlay">Tema escuro para seu conforto</div>
  
  <div class="bottom-nav">
    <div class="nav-item active"><span class="nav-icon">&#127968;</span><span>Inicio</span></div>
    <div class="nav-item"><span class="nav-icon">&#128100;</span><span>Contatos</span></div>
    <div class="nav-item"><span class="nav-icon">&#9881;</span><span>Config</span></div>
  </div>
</div>
</body>
</html>
