<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { width: 1080px; height: 1920px; overflow: hidden; font-family: 'Segoe UI', Roboto, Arial, sans-serif; background: #FFFFFF; }
  
  .phone-frame {
    width: 1080px; height: 1920px; display: flex; flex-direction: column;
    background: #FFFFFF; position: relative;
  }
  
  .status-bar { height: 44px; background: #1976D2; display: flex; align-items: center; justify-content: space-between; padding: 0 16px; color: white; font-size: 14px; }
  .app-bar { height: 64px; background: #1976D2; display: flex; align-items: center; padding: 0 16px; color: white; }
  .app-bar .menu-icon { font-size: 28px; margin-right: 16px; }
  .app-bar .title { font-size: 22px; font-weight: 500; }
  
  .content { flex: 1; padding: 40px 32px; display: flex; flex-direction: column; align-items: center; gap: 32px; }
  
  .qr-card {
    background: white; border-radius: 24px; box-shadow: 0 4px 16px rgba(0,0,0,0.1);
    padding: 48px; display: flex; flex-direction: column; align-items: center; width: 100%;
  }
  
  .qr-container {
    width: 400px; height: 400px; background: white; border: 4px solid #212121;
    border-radius: 16px; display: flex; align-items: center; justify-content: center;
    position: relative;
  }
  
  /* Simulated QR pattern */
  .qr-pattern {
    width: 320px; height: 320px; display: grid; grid-template-columns: repeat(10, 1fr); grid-template-rows: repeat(10, 1fr); gap: 4px;
  }
  .qr-pattern .cell { background: #212121; border-radius: 2px; }
  .qr-pattern .cell.empty { background: transparent; }
  
  .qr-corner { position: absolute; width: 80px; height: 80px; border: 8px solid #212121; border-radius: 8px; }
  .qr-corner::after { content: ''; position: absolute; top: 12px; left: 12px; width: 40px; height: 40px; background: #212121; border-radius: 4px; }
  .qr-corner.tl { top: 16px; left: 16px; }
  .qr-corner.tr { top: 16px; right: 16px; }
  .qr-corner.bl { bottom: 16px; left: 16px; }
  
  .qr-label { font-size: 24px; font-weight: 600; color: #212121; margin-top: 24px; }
  .qr-sublabel { font-size: 16px; color: #757575; margin-top: 8px; }
  
  .profile-mini {
    display: flex; align-items: center; gap: 16px; margin-top: 24px;
    padding: 16px 24px; background: #F5F5F5; border-radius: 12px; width: 100%;
  }
  .mini-avatar { width: 48px; height: 48px; border-radius: 50%; background: #1976D2; color: white; display: flex; align-items: center; justify-content: center; font-size: 20px; font-weight: 600; }
  .mini-info .mini-name { font-size: 18px; font-weight: 600; color: #212121; }
  .mini-info .mini-role { font-size: 14px; color: #757575; }
  
  .actions {
    display: flex; gap: 16px; width: 100%;
  }
  .action-btn {
    flex: 1; padding: 16px; border-radius: 12px; display: flex; align-items: center;
    justify-content: center; gap: 8px; font-size: 16px; font-weight: 500;
  }
  .btn-share { background: #1976D2; color: white; }
  .btn-save { background: #E3F2FD; color: #1976D2; }
  .btn-print { background: #E8F5E9; color: #2E7D32; }
  
  .caption-overlay {
    position: absolute; bottom: 100px; left: 50%; transform: translateX(-50%);
    background: rgba(0,0,0,0.7); color: white; padding: 12px 32px; border-radius: 24px;
    font-size: 20px; font-weight: 500; white-space: nowrap;
  }
  
  .bottom-nav {
    height: 80px; background: white; border-top: 1px solid #E0E0E0;
    display: flex; align-items: center; justify-content: space-around;
  }
  .nav-item { display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 12px; color: #757575; }
  .nav-item.active { color: #1976D2; }
  .nav-item .nav-icon { font-size: 24px; }
</style>
</head>
