name: vcardsmart
description: Cartão de visita digital seguro e offline-first.
publish_to: 'none'
version: 1.0.0+7

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: '>=3.10.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.4.0
  riverpod_annotation: ^2.3.0

  # Navigation
  go_router: ^13.0.0

  # Storage
  hive_flutter: ^1.1.0
  hive: ^2.2.3
  flutter_secure_storage: ^9.0.0

  # Security
  local_auth: ^2.1.0
  encrypt: ^5.0.3
  crypto: ^3.0.3

  # Features
  mobile_scanner: ^3.5.0
  nfc_manager: ^3.0.0
  flutter_contacts: ^2.3.1
  google_mobile_ads: ^4.0.0

  # Utils
  intl: ^0.20.2
  uuid: ^4.2.0
  equatable: ^2.0.5
  path_provider: ^2.1.0
  permission_handler: ^11.0.0
  path: ^1.9.0
  image_picker: ^1.0.0

  # Design
  cupertino_icons: ^1.0.6
  google_fonts: ^6.1.0
  qr_flutter: ^4.1.0
  share_plus: ^10.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  build_runner: ^2.4.0
  riverpod_generator: ^2.3.0
  hive_generator: ^2.0.0
  mockito: ^5.4.0
  json_serializable: ^6.7.0

flutter:
  generate: true
  uses-material-design: true
